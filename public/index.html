<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hard Locals — Content Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Unbounded:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0E0E10;--bg-elev:#15151A;--bg-card:#1A1A20;--bg-hover:#22222A;
--line:#26262E;--line-soft:#1E1E24;
--text:#F5F1EA;--text-muted:#9A9AA5;--text-dim:#5A5A65;
--accent:#E85D1F;--accent-glow:rgba(232,93,31,0.25);--accent-dim:#8A3810;
--info:#4A9EFF;--success:#4ADE80;--danger:#EF4444;
}
html,body{height:100%;background:var(--bg);color:var(--text)}
body{
font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:14px;line-height:1.55;font-weight:400;
-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
letter-spacing:-0.005em;
background-image:radial-gradient(ellipse 80% 50% at 20% 0%,#1A1A22 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 80% 100%,#18181E 0%,transparent 50%);
background-attachment:fixed;
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0.025;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2A2A32;border-radius:4px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3A3A42}
::selection{background:var(--accent);color:#fff}
button,input,textarea{font-family:inherit;color:inherit;outline:none}
button{cursor:pointer;background:none;border:none}
a{color:inherit;text-decoration:none}
#root{min-height:100vh;position:relative;z-index:2}

.app{min-height:100vh;display:flex;flex-direction:column}
.header{padding:18px 32px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;background:rgba(14,14,16,0.85);backdrop-filter:blur(20px);position:sticky;top:0;z-index:50}
.header-left{display:flex;align-items:center;gap:20px}
.menu-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);transition:all 0.2s ease;font-size:16px}
.menu-btn:hover{background:var(--bg-hover);color:var(--text)}
.brand{display:flex;align-items:baseline;gap:14px}
.brand-name{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:800;letter-spacing:0.01em}
.brand-sub{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.18em;font-weight:500;padding-left:14px;border-left:1px solid var(--line)}
.header-right{display:flex;align-items:center;gap:10px}
.status-pill{display:flex;align-items:center;gap:7px;padding:6px 11px;background:var(--bg-card);border:1px solid var(--line-soft);border-radius:100px}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success)}
.status-text{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.12em;font-weight:500}
.header-btn{padding:7px 14px;border:1px solid var(--line);border-radius:7px;color:var(--text-muted);font-size:11px;font-weight:500;letter-spacing:0.02em;transition:all 0.2s ease;background:transparent}
.header-btn:hover{background:var(--bg-hover);color:var(--text);border-color:var(--text-dim);transform:translateY(-1px)}

.body{display:flex;flex:1;min-height:calc(100vh - 73px)}
.sidebar{width:280px;min-width:280px;border-right:1px solid var(--line-soft);padding:20px 0;overflow-y:auto;background:rgba(14,14,16,0.4)}
.sidebar-group{margin-bottom:20px}
.sidebar-group-label{padding:0 24px 10px;font-size:10px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.18em}
.rubric-item{display:flex;align-items:center;gap:12px;padding:11px 24px;cursor:pointer;border-left:2px solid transparent;transition:all 0.2s ease;position:relative}
.rubric-item:hover{background:rgba(232,93,31,0.04);border-left-color:var(--accent-dim)}
.rubric-item.active{background:linear-gradient(90deg,rgba(232,93,31,0.08) 0%,transparent 100%);border-left-color:var(--accent)}
.rubric-item.active::after{content:'';position:absolute;right:14px;top:50%;transform:translateY(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.rubric-icon-s{font-size:15px;width:22px;text-align:center;flex-shrink:0}
.rubric-name-s{flex:1;font-size:13px;font-weight:500;letter-spacing:-0.005em}
.rubric-item.active .rubric-name-s{color:var(--text);font-weight:600}
.rubric-freq-s{font-size:9px;color:var(--text-dim);font-weight:500;text-transform:uppercase;letter-spacing:0.1em}

.content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.empty{flex:1;display:flex;align-items:center;justify-content:center;padding:40px}
.empty-inner{text-align:center;color:var(--text-dim)}
.empty-icon{font-size:56px;opacity:0.15;margin-bottom:16px}
.empty-title{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:600;margin-bottom:4px;color:var(--text-muted)}
.empty-sub{font-size:12px;color:var(--text-dim)}

.rubric-header{padding:28px 40px 22px;border-bottom:1px solid var(--line-soft);flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.rubric-title{display:flex;align-items:center;gap:14px}
.rubric-title-icon{width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,var(--bg-card) 0%,var(--bg-elev) 100%);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px}
.rubric-title-text{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:700;letter-spacing:-0.02em;line-height:1.1}
.rubric-title-sub{font-size:12px;color:var(--text-muted);margin-top:3px;font-weight:400}
.rubric-freq-badge{padding:5px 10px;background:var(--bg-card);border:1px solid var(--line-soft);border-radius:6px;font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.12em;font-weight:500}

.work{flex:1;overflow-y:auto;padding:28px 40px 40px}
.work-inner{max-width:860px;margin:0 auto}

.field{margin-bottom:18px}
.field-label{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.14em;margin-bottom:8px}
.input,.textarea{width:100%;padding:12px 14px;background:var(--bg-card);border:1px solid var(--line-soft);border-radius:8px;font-size:13px;font-weight:400;color:var(--text);transition:all 0.15s ease}
.input:hover,.textarea:hover{border-color:var(--line)}
.input:focus,.textarea:focus{border-color:var(--accent);background:var(--bg-elev);box-shadow:0 0 0 3px var(--accent-glow)}
.input::placeholder,.textarea::placeholder{color:var(--text-dim)}
.textarea{min-height:72px;resize:vertical;font-family:inherit;line-height:1.5}

.actions{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.btn-primary{padding:13px 24px;background:var(--text);color:#0A0A0C;border-radius:8px;font-size:13px;font-weight:600;letter-spacing:-0.005em;transition:all 0.2s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden;border:none}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px -10px rgba(245,241,234,0.3)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:0.4;cursor:wait;transform:none;box-shadow:none}
.btn-primary.accent{background:var(--accent);color:#fff}
.btn-primary.accent:hover{box-shadow:0 12px 32px -8px var(--accent-glow)}
.btn-secondary{padding:11px 18px;background:var(--bg-card);color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:12px;font-weight:500;transition:all 0.2s cubic-bezier(.2,.8,.2,1)}
.btn-secondary:hover{background:var(--bg-hover);border-color:var(--text-dim);transform:translateY(-1px)}
.btn-ghost{padding:9px 14px;background:transparent;color:var(--text-muted);border:1px solid var(--line-soft);border-radius:7px;font-size:11px;font-weight:500;transition:all 0.2s ease}
.btn-ghost:hover{background:var(--bg-card);color:var(--text);border-color:var(--line)}
.hint{font-size:11px;color:var(--text-dim);margin-left:6px}
.error-box{margin-top:14px;padding:12px 16px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:8px;color:#FCA5A5;font-size:12px}

.result-card{margin-top:28px;background:linear-gradient(180deg,var(--bg-card) 0%,var(--bg-elev) 100%);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px -20px rgba(0,0,0,0.5)}
.result-head{padding:16px 22px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.result-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.2em;font-weight:500}
.result-badge{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--success)}
.result-body{padding:20px 22px}
.result-textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:14px;line-height:1.7;resize:none;min-height:100px;font-family:inherit;letter-spacing:-0.003em}

.platforms{display:flex;border-top:1px solid var(--line-soft);background:rgba(0,0,0,0.15);overflow-x:auto}
.platform-tab{padding:14px 22px;font-size:12px;font-weight:500;color:var(--text-dim);border:none;border-bottom:2px solid transparent;transition:all 0.2s ease;white-space:nowrap;background:transparent}
.platform-tab:hover{color:var(--text-muted);background:rgba(255,255,255,0.02)}
.platform-tab.active{color:var(--text);border-bottom-color:var(--accent)}

.preview{padding:22px;min-height:80px;background:#17212B;border-top:1px solid var(--line-soft)}
.preview-text{white-space:pre-wrap;font-size:14px;line-height:1.55;color:#E8EAED;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
.preview-text strong{color:#F5F1EA;font-weight:700}
.preview-text a{color:#4A9EFF;text-decoration:none;border-bottom:1px solid rgba(74,158,255,0.25)}
.preview-text a:hover{border-bottom-color:rgba(74,158,255,0.6)}
.preview-counter{margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);text-align:right;letter-spacing:0.05em}
.preview-counter.over{color:var(--danger)}

.copy-row{display:flex;flex-wrap:wrap;gap:6px;padding:14px 22px;background:rgba(0,0,0,0.2);border-top:1px solid var(--line-soft)}
.copy-btn{padding:7px 14px;background:var(--bg-card);color:var(--text-muted);border:1px solid var(--line-soft);border-radius:6px;font-size:11px;font-weight:500;transition:all 0.2s ease}
.copy-btn:hover{background:var(--bg-hover);color:var(--text);transform:translateY(-1px)}
.copy-btn.copied{background:rgba(74,222,128,0.1);color:var(--success);border-color:rgba(74,222,128,0.3)}

.tools-row{padding:14px 22px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line-soft)}
.tool-btn{padding:9px 16px;background:var(--bg-card);color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:all 0.2s ease}
.tool-btn:hover{background:var(--bg-hover);border-color:var(--text-dim);transform:translateY(-1px);box-shadow:0 4px 12px -4px rgba(0,0,0,0.4)}
.tool-badge{font-size:10px;color:var(--success)}

.post-row{padding:18px 22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line-soft);background:linear-gradient(180deg,rgba(232,93,31,0.03) 0%,transparent 100%)}
.post-btn{padding:11px 20px;background:var(--bg-card);border:1px solid var(--line);border-radius:9px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:all 0.25s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.post-btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px -10px rgba(0,0,0,0.6)}
.post-btn:disabled{opacity:0.5;cursor:wait;transform:none}
.post-status{font-size:11px;margin-left:auto;color:var(--text-muted)}
.post-status.ok{color:var(--success)}
.post-status.err{color:var(--danger)}

.panel{margin-top:14px;background:var(--bg-card);border:1px solid var(--line-soft);border-radius:10px;overflow:hidden}
.panel-head{padding:13px 16px;font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.14em;font-weight:600;border-bottom:1px solid var(--line-soft)}
.panel-body{padding:16px}

.block-card{background:var(--bg-elev);border:1px solid var(--line-soft);border-radius:8px;padding:12px;margin-bottom:8px;transition:border-color 0.2s}
.block-card:hover{border-color:var(--line)}
.block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.block-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);font-weight:500}
.block-actions{display:flex;gap:4px}
.block-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--bg-card);border:1px solid var(--line-soft);border-radius:6px;color:var(--text-muted);font-size:12px;transition:all 0.2s}
.block-btn:hover{background:var(--bg-hover);color:var(--text);transform:translateY(-1px)}
.block-btn.danger:hover{color:var(--danger);border-color:rgba(239,68,68,0.3)}
.block-textarea{width:100%;background:var(--bg);border:1px solid var(--line-soft);border-radius:6px;padding:10px 12px;color:var(--text);font-size:12px;line-height:1.6;resize:vertical;min-height:64px;font-family:inherit}
.add-row{display:flex;gap:6px;margin-top:10px}
.add-row .input{flex:1}

.image-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.image-item{position:relative;cursor:pointer;border:2px solid transparent;border-radius:8px;overflow:hidden;aspect-ratio:4/3;transition:all 0.2s ease}
.image-item:hover{transform:translateY(-2px);box-shadow:0 10px 20px -8px rgba(0,0,0,0.5)}
.image-item.picked{border-color:var(--success);box-shadow:0 0 0 3px rgba(74,222,128,0.2)}
.image-item.dimmed{opacity:0.35}
.image-item img{width:100%;height:100%;object-fit:cover;display:block}
.image-author{position:absolute;bottom:0;left:0;right:0;padding:4px 8px;background:linear-gradient(180deg,transparent,rgba(0,0,0,0.8));font-size:9px;color:rgba(255,255,255,0.7)}
.banner-preview{width:100%;border-radius:8px;margin-top:12px;border:1px solid var(--line);display:block}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:380px;padding:40px 36px;background:linear-gradient(180deg,var(--bg-card) 0%,var(--bg-elev) 100%);border:1px solid var(--line);border-radius:16px;box-shadow:0 40px 80px -20px rgba(0,0,0,0.6)}
.login-brand{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:800;letter-spacing:-0.02em}
.login-sub{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.18em;margin-top:4px;margin-bottom:36px}
.login-field{margin-bottom:12px}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn 0.2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:820px;max-height:85vh;background:var(--bg-card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 80px -20px rgba(0,0,0,0.8)}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:700}
.modal-sub{font-size:11px;color:var(--text-dim);margin-top:2px}
.modal-body{flex:1;overflow-y:auto;padding:16px}
.history-item{padding:14px;background:var(--bg-elev);border:1px solid var(--line-soft);border-radius:9px;margin-bottom:8px;transition:border-color 0.2s}
.history-item:hover{border-color:var(--line)}
.history-meta{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.platform-chip{padding:3px 8px;border-radius:4px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em}
.history-text{font-size:12px;color:var(--text-muted);line-height:1.6;max-height:100px;overflow:hidden;white-space:pre-wrap}
</style>
</head>

function generate(){

if(data.error){setError(String(data.error.message||data.error));setLoading(false);return}
var t="";var cc=data.content||[];
for(var i=0;i<cc.length;i++){if(cc[i].type==="text")t+=(t?"\n":"")+cc[i].text}
t=t.trim();
var markers=["<b>","\u{1F4CC}","\u{1F4CE}","\u{1F6E3}"];
for(var m=0;m<markers.length;m++){var mi=t.indexOf(markers[m]);if(mi>0){t=t.substring(mi);break}}
var pp=t.split("\n");var out=[];var buf="";
for(var pi=0;pi<pp.length;pi++){
var ln=pp[pi].trim();
if(ln===""||ln==="."||ln===". "){if(buf){out.push(buf);buf=""}out.push("")}
else if(ln.indexOf("\u{1F4CE}")>=0||ln.indexOf("\u{1F4CC}")>=0||(ln.indexOf("<b>")===0&&buf.indexOf("<b>")<0)){if(buf)out.push(buf);buf="";out.push("");out.push(ln)}
else{if(buf){var lc=buf.charAt(buf.length-1);if(lc!=="."&&lc!==","&&lc!==":"&&lc!==";"&&lc!=="!"&&lc!=="?"&&ln.charAt(0)!=="."&&ln.charAt(0)!==","){buf+=". "+ln}else{buf+=" "+ln}}else{buf=ln}}
}
if(buf)out.push(buf);
t=out.join("\n").replace(/\n{3,}/g,"\n\n").replace(/ \. /g,". ").replace(/\. \./g,".").trim();
var finalLines=t.split("\n");
for(var fi=0;fi<finalLines.length;fi++){
var fl=finalLines[fi].trim();if(!fl)continue;
if(fl.indexOf("<b>")>=0&&fl.indexOf("</b>")===fl.length-4)continue;

var lastCh=fl.charAt(fl.length-1);
if(lastCh===">"){var bt=fl.replace(/<\/[a-z]+>\s*$/,"");var rl=bt.charAt(bt.length-1);if(rl&&".!?,:;".indexOf(rl)<0)finalLines[fi]=fl.replace(/(<\/[a-z]+>)\s*$/,".$1")}
else if(lastCh&&".!?,:;".indexOf(lastCh)<0)finalLines[fi]=fl+".";
}
t=finalLines.join("\n");
if(!t){setError("Пустой ответ");setLoading(false);return}
setText(t);setPostMsg("");setLoading(false);
if(rub&&rub.id==="moto_news"){setBlocks(parseIntoBlocks(t))}else{setBlocks(null)}
}).catch(function(e){setError(String(e.message||e));setLoading(false)})}

function renderTelegramHTML(txt){

s=s.replace(/<\/a>/g,"\u0001a\u0002");
s=s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
s=s.replace(/\u0001B\u0002/g,"<strong>").replace(/\u0001b\u0002/g,"</strong>");
s=s.replace(/\u0001I\u0002/g,"<em>").replace(/\u0001i\u0002/g,"</em>");
s=s.replace(/\u0001A([^\u0003]+)\u0003\u0002/g,function(m,url){return "<a href=\""+url+"\" target=\"_blank\">"});
s=s.replace(/\u0001a\u0002/g,"</a>");
return s;
}
